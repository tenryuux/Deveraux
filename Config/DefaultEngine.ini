[SystemSettings]
; Projeto Deveraux: ceu com mais resolucao, para os raios de luz que a sombra das nuvens desenha
; na atmosfera ficarem nitidos (recomendacao da Epic para Cast Cloud Shadows; o padrao e 192 x 104)
r.SkyAtmosphere.FastSkyLUT.Width=256
r.SkyAtmosphere.FastSkyLUT.Height=256
; Projeto Deveraux: mais passos na atmosfera. A sombra das nuvens no ar e desenhada passo a passo em cada
; direcao do ceu; com poucos passos ela sai em faixas e aneis duros. O Sky Atmosphere multiplica os passos
; (Atmosphere Shadow Quality, em Project Settings > Deveraux Ceu), mas a Unreal corta nestes limites.
; Todas as direcoes ganham o maximo de passos a partir de 50 km de ar. A sombra no chao nao muda
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=256
r.SkyAtmosphere.FastSkyLUT.DistanceToSampleCountMax=50
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=8
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=32

